[build]
  command = "npm run build"
  publish = "dist"

# Серверные функции (netlify/functions). firebase-admin не собираем в бандл — он ставится как зависимость
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# /api/* → функции. Правило выше общего SPA-правила: Netlify проверяет их по порядку
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200