[build]
  command = "npm run build"
  publish = "dist"

# Серверные функции (netlify/functions). firebase-admin не собираем в бандл — он ставится как зависимость
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Перенаправления (/api/* → функции и SPA) — в public/_redirects: Netlify применяет его раньше этого файла
